apiVersion: apps/v1
kind: Deployment
metadata: {name: beyond-llm-frontend, labels: {app: beyond-llm-frontend}}
spec:
  replicas: 1
  selector: {matchLabels: {app: beyond-llm-frontend}}
  template:
    metadata: {labels: {app: beyond-llm-frontend}}
    spec:
      containers:
        - name: frontend
          image: image-registry.openshift-image-registry.svc:5000/REPLACE_NAMESPACE/beyond-llm-frontend:latest
          ports: [{containerPort: 8080, name: http}]
          env:
            - {name: BACKEND_URL, value: "http://benchmark-backend:8080"}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: http}
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Service
metadata: {name: beyond-llm-frontend}
spec:
  selector: {app: beyond-llm-frontend}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: {name: beyond-llm-dashboard}
spec:
  to: {kind: Service, name: beyond-llm-frontend}
  port: {targetPort: http}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
