# OPTIONAL and NOT part of the default kustomization. A CPU-only Ollama for small models in the Sandbox.
# Kev's *-mlx-* tags require Apple Silicon (MLX runner) and cannot run here; non-MLX Kev tags (e.g. kev:0.8b-q8_0)
# are listed by Ollama but their Linux/CPU support is unverified by this project. Qwen3.5-4B / NuExtract3 on 2 vCPUs
# will be slow (seconds to tens of seconds per request). Apply only if you accept that:
#   oc apply -f deployments/openshift/optional/ollama-cpu.yaml
#   oc exec deploy/beyond-llm-ollama -- ollama pull qwen3.5:4b
# Gemma 4 12B as a decision model (gemma4-12b-decision; on Linux Ollama pulls an 8.0 GB GGUF Q4_K_M build). Expect
# about 20-25 s per question on Sandbox CPU, i.e. ~90 s per message (four questions):
#   oc exec deploy/beyond-llm-ollama -- ollama pull gemma4:12b
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: beyond-llm-ollama-models}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 20Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: beyond-llm-ollama, labels: {app: beyond-llm-ollama}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: beyond-llm-ollama}}
  template:
    metadata: {labels: {app: beyond-llm-ollama}}
    spec:
      containers:
        - name: ollama
          image: docker.io/ollama/ollama:0.40.15
          ports: [{containerPort: 11434, name: http}]
          env:
            - {name: HOME, value: /models}
            - {name: OLLAMA_MODELS, value: /models/.ollama/models}
            - {name: OLLAMA_HOST, value: "0.0.0.0:11434"}
            - {name: OLLAMA_NUM_PARALLEL, value: "1"}
          resources:
            # Gemma 4 12B Q4_K_M needs more than 16 Gi: 8.0 GB weights plus the llama.cpp prompt cache, which grows over a
            # run (OOMKilled at a 16 Gi limit on 2026-11-10). 6-10 Gi is enough for the 4B models.
            requests: {cpu: "1", memory: 10Gi}
            limits: {cpu: "8", memory: 24Gi}
          volumeMounts: [{name: models, mountPath: /models}]
          readinessProbe:
            httpGet: {path: /api/version, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: beyond-llm-ollama-models}
---
apiVersion: v1
kind: Service
metadata: {name: beyond-llm-ollama}
spec:
  selector: {app: beyond-llm-ollama}
  ports: [{name: http, port: 11434, targetPort: http}]
