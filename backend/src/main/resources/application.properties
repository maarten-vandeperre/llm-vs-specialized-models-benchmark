# ------------------------------------------------------------------
# Beyond the LLM benchmark – configuration (override with env vars, e.g. BENCH_OLLAMA_BASE_URL)
# ------------------------------------------------------------------
quarkus.application.name=beyond-llm-benchmark
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.banner.enabled=false
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n
quarkus.smallrye-openapi.info-title=Beyond the LLM benchmark API
quarkus.swagger-ui.always-include=true
# The upstream LangChain4j OllamaChatModel is built programmatically (think=false, JSON schema, recording client);
# disable the Quarkus-managed default chat model bean so it does not require configuration.
quarkus.langchain4j.ollama.chat-model.enabled=false
quarkus.langchain4j.ollama.devservices.enabled=false
quarkus.langchain4j.devservices.enabled=false

# Inference endpoints (local-only by default)
bench.ollama.base-url=http://localhost:11434
bench.gliner.base-url=http://localhost:8090
# Optional separate service processes per checkpoint (so RSS/CPU are attributable per model); default = base-url
bench.gliner.small-url=http://localhost:8093
bench.gliner.multi-url=http://localhost:8091
bench.gliner.decide-url=http://localhost:8092
bench.timeout-seconds=180
bench.ollama.keep-alive=30m
# Context window for generative models. Inputs that do not fit are rejected (truncate=false), never silently cut.
bench.ollama.num-ctx=16384
# Thinking/reasoning for generative models (Qwen3.5, NuExtract3). Disabled by default.
bench.generative.think=false
bench.gliner.threshold=0.5

# Model tags (verified against registry.ollama.ai on 2026-11-07)
bench.models.kev.tag=kev:0.8b-mlx-bf16
bench.models.kev-large.tag=kev:4b-mlx-bf16
# Gemma 4 12B as a decision model (letter log-probabilities via /api/chat; see LetterDecisionModel)
bench.models.gemma-decision.tag=gemma4:12b
bench.models.nuextract.tag=numind/nuextract3:q4_k_m
bench.models.qwen.tag=qwen3.5:4b
# Comma-separated list restricting which candidates are registered (empty = all)
# bench.models.enabled=kev-0.8b,gliner2.5-base

# Optional commercial API baselines (opt-in; keys only from the environment, never commit them)
bench.openai.api-key=${OPENAI_API_KEY:}
bench.anthropic.api-key=${ANTHROPIC_API_KEY:}
bench.openai.base-url=https://api.openai.com
bench.anthropic.base-url=https://api.anthropic.com
%test.bench.openai.api-key=
%test.bench.anthropic.api-key=

# Hybrid routing thresholds (overridden by results/calibration/thresholds.json when present)
bench.hybrid.kev-threshold=0.80
bench.hybrid.gliner-threshold=0.80

# Storage
bench.results-dir=../results
bench.datasets-dir=../datasets

%test.bench.results-dir=target/test-results
%test.bench.ollama.base-url=http://localhost:1
%test.bench.gliner.base-url=http://localhost:1
